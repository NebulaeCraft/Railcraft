import groovy.xml.MarkupBuilder
import net.minecraftforge.gradle.tasks.SignJar

buildscript {
    repositories {
        jcenter()
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

plugins {
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'idea'
apply from: 'api-railcraft/gradle.properties', to: project.ext

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

def isMacosArm = org.gradle.internal.os.OperatingSystem.current().isMacOsX() &&
        ['aarch64', 'arm64'].contains(System.getProperty('os.arch').toLowerCase())

group = "com.headlamp-games" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "railcraft"

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.incremental = true
    }

    version = project.version
}

if (file("passwords.properties").exists()) {
    apply from: 'passwords.properties', to: project.ext
    println "Loading secure configs..."
}

ext {
    dirApi = "./api-railcraft"
    dirRelease = "./release"
    dirLang = "./lang"
    // apiForestry = "./api/forestry"
    // apiThaumcraft = "./api/thaumcraft"
    // apiBuildcraft = "./api/buildcraft"

    dirDest = './build/distributions'
}

println ''
println '*************************************************************'
println 'Project Version: ' + project.version
println '*************************************************************'
println ''

minecraft {
    version = project.version_minecraft + "-" + project.version_forge
    runDir = "run"

    mappings = project.version_mcp.replace("-", "_")

    replace '@VERSION@', project.version
    makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

def actualRunDir = project.file(minecraft.runDir)
// Change the 4G in -Xmx4G to your desired max RAM and 4G in -Xms4G to your desired initial RAM

def optimizedVmArgs = [
        "-Xms4G",
        "-Xmx4G",
        "-XX:+UseG1GC",
        "-XX:+ParallelRefProcEnabled",
        "-XX:MaxGCPauseMillis=200",
        "-XX:+UnlockExperimentalVMOptions",
        "-XX:+DisableExplicitGC",
        "-XX:+AlwaysPreTouch",
        "-XX:G1NewSizePercent=30",
        "-XX:G1MaxNewSizePercent=40",
        "-XX:G1HeapRegionSize=8M",
        "-XX:G1ReservePercent=20",
        "-XX:G1HeapWastePercent=5",
        "-XX:G1MixedGCCountTarget=4",
        "-XX:InitiatingHeapOccupancyPercent=15",
        "-XX:G1MixedGCLiveThresholdPercent=90",
        "-XX:G1RSetUpdatingPauseTimePercent=5",
        "-XX:SurvivorRatio=32",
        "-XX:+PerfDisableSharedMem",
        "-XX:MaxTenuringThreshold=1"
]
def assertionVmArgs = ['-ea:mods.railcraft...', '-ea:net.minecraft...', '-ea:net.minecraftforge...']
def nativeVmArgs = isMacosArm ? [
        '-Djava.library.path=' + file("$buildDir/natives").absolutePath,
        '-Xbootclasspath/p:' + file("$buildDir/patches/apple-silicon-narrator.jar").absolutePath
] : []
def log4jVmArgs = ['-Dlog4j.configurationFile=' + new File(actualRunDir, 'log4j2.xml').toString()]
def railcraftDebugArgs = ['-Drailcraft.log.categories=registry,models']
def combinedVmArgs = [assertionVmArgs, optimizedVmArgs, nativeVmArgs, log4jVmArgs, railcraftDebugArgs].flatten()
def extraEnvs = new LinkedHashMap() //['LOG4J_CONFIGURATION_FILE': "log4j2.xml"]

minecraft {
    clientJvmArgs = combinedVmArgs
    serverJvmArgs = combinedVmArgs
}

idea {
    module {
        //some extra dirs that should be excluded by IDEA
        excludeDirs += file('run/')
        excludeDirs += file('logs/')

//        inheritOutputDirs = false
    }
}

sourceSets {
    api {
        java {
            srcDirs += [
                    project.dirApi + "/src/api/java"
            ]
        }
    }
    main {
        java {
            srcDirs += [
                    project.dirRelease + "/src/main/java"
            ]
        }
        resources {
            exclude '**/Thumbs.db'
            srcDirs += [
                    project.dirRelease + "/src/main/resources",
                    project.dirLang + "/src/main/resources"
            ]
        }
    }
}

println ""
println "Source Sets:"
println "-- api:"
sourceSets.api.java.srcDirs.each {
    println "---- " + it
}
println "-- main:"
sourceSets.main.java.srcDirs.each {
    println "---- " + it
}
println "-- resourses:"
sourceSets.main.resources.srcDirs.each {
    println "---- " + it
}
println ""

repositories {
    mavenCentral()
    maven {
        name = "buildcraft"
        url = "https://mod-buildcraft.com/maven/"
    }
    maven {
        name = "ic2"
        url = "http://maven.ic2.player.to/"
    }
    maven {
        name = "jei"
        url = "http://dvs1.progwml6.com/files/maven/"
    }
}

configurations {
    api
    macosArmNatives
    compileOnly.extendsFrom api
}

if (isMacosArm) {
    configurations.all {
        resolutionStrategy.force 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
        resolutionStrategy.force 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
        resolutionStrategy.force 'net.java.dev.jna:jna:5.13.0'
    }
}

dependencies {
    macosArmNatives fileTree(dir: 'gradle/macos-arm64-natives', include: ['*.jar'])
    // forestry
    compileOnly "net.sengir.forestry:forestry_${project.version_minecraft}:${project.version_forestry}:api"
    runtimeOnly "net.sengir.forestry:forestry_${project.version_minecraft}:${project.version_forestry}"
    // IC2
    api "net.industrial-craft:industrialcraft-2:${project.version_industrialcraft}:api"
    runtimeOnly "net.industrial-craft:industrialcraft-2:${project.version_industrialcraft}"
    // BuildCraft
    compileOnly "com.mod-buildcraft:buildcraft-api:${project.version_buildcraft}"
    // JEI
    deobfProvided "mezz.jei:jei_${project.version_minecraft}:${project.version_jei}"
    // annotations
    apiCompileOnly "org.jetbrains:annotations:16.0.2"
    compileOnly "org.jetbrains:annotations:16.0.2"
    // libs folder in case
    implementation fileTree(dir: 'lib', include: '*.jar')
    // Tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.3.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.3.1'
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "version_minecraft", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and version_minecraft
        expand 'version': project.version, 'version_minecraft': project.minecraft.version
    }

    // copy everything else, that is not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude '**/*.md'
        exclude '**/Thumbs.db'
    }
}

runClient {
    // in git bash, do (replace stuff in the <>) ./gradlew runClient -PmcUsername=<your minecraft login email> -PmcPassword=<your minecraft password>
    if (project.hasProperty('mcUsername') && project.hasProperty('mcPassword')) {
        args "--username=${project.mcUsername}"
        args "--password=${project.mcPassword}"
    }
}

runServer {
    doFirst {
        new File(workingDir, "eula.txt").text = "eula=true"
    }
    args "nogui" // no server gui, we have console
}

test {
    useJUnitPlatform()

    // listen to events in the test execution lifecycle
    beforeTest { descriptor ->
        logger.lifecycle("Running: $descriptor")
    }

    // Fail the 'test' task on the first test failure
    failFast = true
}

task copyLog4jConfig(type: Copy) {
    from('extras') {
        include 'log4j2.xml'
    }
    into actualRunDir
}

task copyMacosArmNatives(type: Copy) {
    onlyIf {
        isMacosArm
    }
    from {
        configurations.macosArmNatives.collect { zipTree(it) }
    }
    include 'liblwjgl.dylib', 'openal.dylib', 'libjinput-osx.jnilib'
    into "$buildDir/natives"
}

task compileAppleSiliconNarrator(type: JavaCompile) {
    onlyIf {
        isMacosArm
    }
    source = fileTree('src/appleSiliconPatch/java') {
        include '**/*.java'
    }
    classpath = files()
    destinationDir = file("$buildDir/classes/appleSiliconPatch")
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task appleSiliconNarratorJar(dependsOn: compileAppleSiliconNarrator) {
    onlyIf {
        isMacosArm
    }
    inputs.dir compileAppleSiliconNarrator.destinationDir
    outputs.file file("$buildDir/patches/apple-silicon-narrator.jar")
    doLast {
        def patchJar = file("$buildDir/patches/apple-silicon-narrator.jar")
        patchJar.parentFile.mkdirs()
        ant.jar(destfile: patchJar, basedir: compileAppleSiliconNarrator.destinationDir)
    }
}

task prepareIdeaRunOutput(type: Sync, dependsOn: classes) {
    // Forge 1.12 treats the directory containing the @Mod class as that
    // mod's resource pack. Gradle keeps classes and processed resources in
    // separate directories, so merge them for IDEA Application launches.
    from sourceSets.main.output
    into "$buildDir/ideaRuns/main"
}

task prepareRunClient(dependsOn: [prepareIdeaRunOutput, copyLog4jConfig, copyMacosArmNatives, appleSiliconNarratorJar])
task prepareRunServer(dependsOn: [prepareIdeaRunOutput, copyLog4jConfig])

runClient.dependsOn prepareRunClient
runServer.dependsOn prepareRunServer

if (isMacosArm) {
    // ForgeGradle 2.3 uses a retired HTTP asset endpoint and retries all 1305
    // files on every launch. Existing cached assets are sufficient for dev.
    getAssets.enabled = false
}

tasks.matching { it.name == 'extractNatives' }.all {
    finalizedBy copyMacosArmNatives
    copyMacosArmNatives.mustRunAfter it
}

tasks.withType(JavaExec) {
    dependsOn copyLog4jConfig
    environment extraEnvs
    outputs.upToDateWhen { false }
    workingDir actualRunDir
}

task writeIdeaRunConfigurations {
    doLast {
        def runConfigurationsDir = file('.idea/runConfigurations')
        runConfigurationsDir.mkdirs()

        [runClient, runServer].each { task ->
            def taskName = task.name
            def mainClass = taskName == 'runClient' ? 'mods.railcraft.dev.RunClient' : 'mods.railcraft.dev.RunServer'
            def props = combinedVmArgs.join(' ') // task.jvmArgs.join(' ') has too much trash
            def args = task.args.join(' ')

            def writer = new FileWriter(new File(runConfigurationsDir, "${taskName}.xml"))
            def xml = new MarkupBuilder(writer)

            xml.component(name: "ProjectRunConfigurationManager") {
                configuration(default: 'false', name: taskName, type: "Application", factoryName: "Application", singleton: "true") {
                    option(name: 'MAIN_CLASS_NAME', value: mainClass)
                    option(name: 'VM_PARAMETERS', value: props)
                    option(name: 'PROGRAM_PARAMETERS', value: args)
                    option(name: 'WORKING_DIRECTORY', value: task.workingDir)
                    envs() {
                        extraEnvs.entrySet().each { envVar ->
                            env(name: envVar.key, value: envVar.value)
                        }
                    }
                    module(name: 'railcraft.main')
                    classpathModifications {
                        // IDEA compiles raw @VERSION@/${version} placeholders into its own
                        // module output. Forge also requires a mod's classes and resources
                        // to share one root, so use Gradle's merged, processed run output.
                        entry(path: '$PROJECT_DIR$/build/classes/production/railcraft.main', exclude: 'true')
                        entry(path: '$PROJECT_DIR$/build/ideaRuns/main')
                        // ForgeGradle generates these launchers outside IDEA's indexed model.
                        entry(path: "\$USER_HOME\$/.gradle/caches/minecraft/net/minecraftforge/forge/${project.version_minecraft}-${project.version_forge}/start")
                    }
                    method(v: '2') {
                        option(name: 'Gradle.BeforeRunTask', enabled: 'true', tasks: taskName == 'runClient' ? 'prepareRunClient' : 'prepareRunServer', externalProjectPath: '$PROJECT_DIR$')
                    }
                }
            }
        }

        // ForgeGradle 2.3 also writes legacy "Minecraft Client/Server"
        // configurations into workspace.xml. The project-level runClient and
        // runServer configurations above replace them, so remove the duplicates.
        def workspaceFile = file('.idea/workspace.xml')
        if (workspaceFile.exists()) {
            def workspaceXml = workspaceFile.getText('UTF-8')
            def cleanedWorkspaceXml = workspaceXml
                    .replaceAll(/(?s)\s*<configuration\b(?=[^>]*\bname="Minecraft (?:Client|Server)")[^>]*>.*?<\/configuration>/, '')
                    .replaceAll(/(?m)^\s*<item\s+itemvalue="[^"]*\.Minecraft (?:Client|Server)"\s*\/>\s*\r?\n?/, '')

            if (cleanedWorkspaceXml != workspaceXml) {
                workspaceFile.setText(cleanedWorkspaceXml, 'UTF-8')
            }
        }
    }
}

tasks.getByName('genIntellijRuns') {
    dependsOn copyLog4jConfig
    finalizedBy writeIdeaRunConfigurations
}

compileJava {
    options.compilerArgs += [
            '-Xlint:-processing',
            '-proc:none'
    ]
//    options.deprecation = true
    options.encoding = 'utf8'
}

tasks.withType(Jar) {
    from sourceSets.api.output
    from {
        configurations.api.collect {
            it.isDirectory() ? it : zipTree(it).matching {
                include '**/ic2/api/energy/**'
                include '**/ic2/api/info/**'
                include '**/ic2/api/item/**'
                include '**/ic2/api/recipe/**'
                exclude '**/ic2/**/package-info.java'
                exclude '**/ic2/**/package-info.class'
            }
        }
    }

    exclude '**/Thumbs.db'
    // IDEA-only bridges for ForgeGradle's generated launchers.
    exclude 'mods/railcraft/dev/**'
    into('mods/railcraft/api') {
        from project.dirApi + "/LICENSE.md"
    }
//    into('forestry/api') {
//        from project.apiForestry + "/LICENSE.txt"
//    }
//    into('thaumcraft/api') {
//        from "./src/api/java/thaumcraft/api/LICENSE.txt"
//    }
//    into('buildcraft/api') {
//        from "./src/api/java/buildcraft/api/LICENSE.API"
//    }

    destinationDir = file(dirDest)
    includeEmptyDirs = false

    manifest {
        attributes(
                'FMLAT': 'railcraft_at.cfg'
        )
    }
}

task devJar(type: Jar, dependsOn: 'classes') {
    from sourceSets.main.output

    extension = 'jar'
    classifier = 'dev'
}

class JarSigner extends SignJar {
    JarSigner() {
        onlyIf {
            project.hasProperty('signingPassword')
        }

        exclude '**/api/**'

        // These properties are intended to be loaded from a "passwords.properties" file
        if (project.hasProperty('signingAlias')) {
            alias = project.signingAlias
        }
        if (project.hasProperty('signingPassword')) {
            storePass = project.signingPassword
            keyPass = project.signingPassword
        }
        if (project.hasProperty('signingKeystore')) {
            keyStore = project.signingKeystore
        } else {
            keyStore = System.getProperty("user.home") + '/.keystore'
        }
    }
}

task signMainJar(type: JarSigner, dependsOn: 'jar') {
    inputFile = jar.getArchivePath()
    outputFile = jar.getArchivePath()
}

task signDevJar(type: JarSigner, dependsOn: 'devJar') {
    inputFile = devJar.getArchivePath()
    outputFile = devJar.getArchivePath()
}

task apiSourceJar(type: Jar) {
    from sourceSets.api.java
    include '**/mods/railcraft/api/**/*.java'
    from project.dirApi + "/LICENSE.md"
    include '**/LICENSE.md'
    destinationDir = file(dirDest)
    classifier = 'api-sources'
    extension = 'jar'
}

task apiJar(type: Jar) {
    from sourceSets.api.output
    include '**/mods/railcraft/api/**'
    from project.dirApi + "/LICENSE.md"
    include '**/LICENSE.md'
    destinationDir = file(dirDest)
    classifier = 'api'
    extension = 'jar'
}

build.dependsOn signMainJar, signDevJar, apiSourceJar, apiJar
uploadArchives.shouldRunAfter build

if (project.hasProperty("ftpUsername"))
    uploadArchives {
        repositories {
            ivy {
                url "sftp://ftp.railcraft.info:22/home2/railcraf/public_html/ivy"
                credentials {
                    username project.ftpUsername
                    password project.ftpPassword
                }
                layout 'gradle'
            }
        }
    }

String jarPath = project.configurations.archives.artifacts.find { it.classifier == "" }.file
println "Output Jar: " + jarPath

println "Railcraft $project.version - MC $project.version_minecraft"

if (project.hasProperty("curseAPI"))
    curseforge {
        apiKey = project.curseAPI
        project {
            id = '51195'
            changelog = new File("src/main/resources/change_log.txt")
            releaseType = project.version.contains('beta') ? 'beta' : 'release'
            addGameVersion project.version_minecraft

            mainArtifact(jar) {
                displayName = "Railcraft $project.version - MC $project.version_minecraft"
            }
        }
    }

artifacts {
    archives jar
    archives devJar
    archives apiJar
    archives apiSourceJar
}
